<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/style02.css">
</head>
<body>
    <main>
        <img src="imagens/google.01.png" alt="google">

        <article>
            <h1>Encontre seu e-mail</h1>

            <p>
                Digite seu número de telefone ou <br> e-mail de recuperação.
            </p>
        </article>

        <form action="senha_esquecida.html" method="post" autocomplete="on">

            <input type="email" name="email" id="iemail" minlength="8"
            maxlength="50"
            placeholder="Número de telefone ou e-mail" required>

            <input type="submit" value="Avançar" id="avançar">
        </form>
    </main>
</body>
</html>
