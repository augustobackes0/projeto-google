<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/style03.css">
</head>
<body>
    <main>
        <img src="imagens/google.01.png" alt="google">

        <article>
            <h1>Qual é seu nome?</h1>
            <p>
                Digite o nome na sua conta Google
            </p>
        </article>

        <form action="" method="post" autocomplete="on">

            <input type="text" name="text" id="itext" required maxlength="16" placeholder="Nome">
            
            <input type="text" name="texto" id="itexto" required maxlength="20" placeholder="Sobrenome (opcional)">

            <input type="submit" value="Avançar">
        </form>
    </main>
</body>
</html>
